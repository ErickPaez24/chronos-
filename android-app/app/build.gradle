plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.chronosabc'
    compileSdk 34

    defaultConfig {
        applicationId "com.chronosabc"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // ESTRUCTURA PARA AAR/JAR/SO NATIVAS:
    // Si el lector 2C-LDH808 provee librerías (.so), agrégalas en `src/main/jniLibs/armeabi-v7a`, `src/main/jniLibs/arm64-v8a`, etc.
    // sourceSets {
    //     main {
    //         jniLibs.srcDirs = ['src/main/jniLibs']
    //     }
    // }
}

dependencies {
    // ARCHIVOS LOCALES (SDK USB / Huella):
    // Descomenta esto para integrar archivos .jar o .aar colocados en el directorio "app/libs/"
    // implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    def room_version = "2.6.1"
    def composeBom = platform("androidx.compose:compose-bom:2024.02.01")

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Biometric
    implementation "androidx.biometric:biometric:1.2.0-alpha05"

    // BCrypt
    implementation "org.mindrot:jbcrypt:0.4"
}
